<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catalog Page</title>
</head>
<body>
    <form id="cart-form">
        <input type="text" id="input-name" class="border" placeholder="Name">
        <input type="email" id="input-email" class="border" placeholder="Email">
        <input type="number" id="input-quantity" class="border" placeholder="Quantity">
        <button type="submit">Add to Cart</button>
    </form>
</body>
</html>
